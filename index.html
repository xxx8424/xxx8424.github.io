<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>一个白西瓜</title>
<meta name="description" content="我的软件作品，点开就能下载。" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<meta property="og:type" content="website" />
<meta property="og:title" content="一个白西瓜" />
<meta property="og:description" content="我的软件作品，点开就能下载。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231d1d1f'/%3E%3Ccircle cx='50' cy='50' r='17' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#ffffff;
    --bg-soft:#f5f5f7;
    --card:#ffffff;
    --text:#1d1d1f;
    --text-2:#6e6e73;
    --text-3:#a1a1a6;
    --line:#e8e8ed;
    --line-strong:#d2d2d7;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px -16px rgba(0,0,0,.16);
    --radius:20px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000;
      --bg-soft:#1c1c1e;
      --card:#141415;
      --text:#f5f5f7;
      --text-2:#8e8e93;
      --text-3:#636366;
      --line:#262628;
      --line-strong:#3a3a3c;
      --shadow:0 1px 2px rgba(0,0,0,.5),0 18px 40px -20px rgba(0,0,0,.9);
    }
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    transition:background .35s ease,color .35s ease;
    min-height:100vh;display:flex;flex-direction:column;
    overflow-x:hidden;
  }
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  ::selection{background:rgba(79,156,249,.25)}

  /* ---------- 首屏：头像 + 名字 + 账号 ---------- */
  main{flex:1}
  .hero{max-width:1120px;margin:0 auto;padding:132px 24px 56px;text-align:center}
  @media (max-width:640px){.hero{padding:96px 22px 44px}}
  .avatar{
    width:84px;height:84px;margin:0 auto 26px;border-radius:50%;
    display:grid;place-items:center;font-size:33px;font-weight:600;color:#fff;
    background:linear-gradient(145deg,#4f9cf9,#7c5cf0);
    box-shadow:0 16px 36px -16px rgba(80,110,240,.7),inset 0 1px 0 rgba(255,255,255,.35);
    user-select:none;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
  h1{
    margin:0;font-size:clamp(40px,7vw,72px);line-height:1.05;
    letter-spacing:-.035em;font-weight:700;
  }
  .socials{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:34px;flex-wrap:wrap}
  .social{
    display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;
    border-radius:980px;border:1px solid var(--line);background:var(--card);
    font-size:14px;font-weight:500;color:var(--text-2);
    transition:transform .25s cubic-bezier(.16,1,.3,1),border-color .2s ease,color .2s ease,background .2s ease;
  }
  .social:hover{color:var(--text);border-color:var(--line-strong);background:var(--bg-soft);transform:translateY(-1px)}
  .social svg{width:16px;height:16px;flex:none;fill:currentColor}

  /* ---------- 作品 ---------- */
  .works{border-top:1px solid var(--line);padding:40px 0 88px}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}
  @media (max-width:640px){.wrap{padding:0 22px}}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
  .chip{
    height:32px;padding:0 14px;border-radius:980px;font-size:13px;color:var(--text-2);
    border:1px solid var(--line);background:transparent;
    transition:all .2s ease;
  }
  .chip:hover{border-color:var(--line-strong);color:var(--text)}
  .chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
  @media (max-width:680px){.grid{grid-template-columns:1fr}}

  .card{
    position:relative;display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:24px;box-shadow:var(--shadow);
    transition:transform .4s cubic-bezier(.16,1,.3,1),border-color .3s ease,box-shadow .4s ease;
  }
  .card:hover{transform:translateY(-4px);border-color:var(--line-strong);box-shadow:0 2px 4px rgba(0,0,0,.05),0 24px 48px -24px rgba(0,0,0,.24)}
  @media (prefers-color-scheme: dark){.card:hover{box-shadow:0 24px 48px -24px rgba(0,0,0,1)}}
  .card-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .app-icon{
    width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;
    font-size:22px;font-weight:600;color:#fff;letter-spacing:-.02em;user-select:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 18px -10px rgba(0,0,0,.5);
    background:linear-gradient(145deg,#4f9cf9,#2f6ee0);
  }
  .app-icon.emoji{background:var(--bg-soft);box-shadow:inset 0 0 0 1px var(--line);font-size:25px}
  .app-icon img{width:100%;height:100%;object-fit:cover;border-radius:14px}
  .tone-blue{background:linear-gradient(145deg,#4f9cf9,#2f6ee0)}
  .tone-purple{background:linear-gradient(145deg,#a78bfa,#7357e8)}
  .tone-green{background:linear-gradient(145deg,#3ddc97,#1fa971)}
  .tone-orange{background:linear-gradient(145deg,#ffb86b,#f0782c)}
  .tone-pink{background:linear-gradient(145deg,#f9a8d4,#e0619b)}
  .tone-gray{background:linear-gradient(145deg,#c7c7cc,#8e8e93)}
  .app-name{margin:0;font-size:17px;font-weight:600;letter-spacing:-.015em}
  .app-tagline{margin:3px 0 0;font-size:13px;color:var(--text-2)}
  .app-desc{margin:0 0 18px;font-size:14px;line-height:1.6;color:var(--text-2)}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px;padding:0;list-style:none}
  .meta li{font-size:11.5px;color:var(--text-2);padding:4px 9px;border-radius:6px;background:var(--bg-soft)}
  .card-spacer{flex:1}
  .dl{display:flex;gap:10px;flex-wrap:wrap}
  .dl .btn{flex:1 1 0;min-width:118px;height:42px;font-size:14px;padding:0 14px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    height:44px;padding:0 24px;border-radius:980px;
    font-size:15px;font-weight:500;white-space:nowrap;
    transition:transform .25s cubic-bezier(.16,1,.3,1),background .2s ease,opacity .2s ease,box-shadow .25s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--text);color:var(--bg);box-shadow:0 8px 20px -12px rgba(0,0,0,.6)}
  .btn-primary:hover{transform:translateY(-1px);opacity:.9}
  .btn-soft{background:var(--bg-soft);color:var(--text);border:1px solid var(--line)}
  .btn-soft:hover{background:var(--line);transform:translateY(-1px)}
  .btn svg{width:16px;height:16px;flex:none}
  .codes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .code{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12px;color:var(--text-2);
    background:var(--bg-soft);border-radius:8px;padding:6px 10px;
    transition:background .2s ease,color .2s ease;
  }
  .code:hover{background:var(--line);color:var(--text)}
  .code b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600;color:var(--text);letter-spacing:.04em}
  .card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .src{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);transition:color .2s ease}
  .src:hover{color:var(--text)}
  .src svg{width:14px;height:14px}

  /* ---------- 页脚 ---------- */
  footer{border-top:1px solid var(--line);padding:30px 0 40px}
  .foot{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:var(--text-2)}
  .foot .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#4f9cf9,#7c5cf0)}

  /* ---------- 吐司 ---------- */
  .toast{
    position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);
    background:var(--text);color:var(--bg);
    padding:10px 18px;border-radius:980px;font-size:13.5px;font-weight:500;
    opacity:0;pointer-events:none;z-index:99;
    transition:opacity .25s ease,transform .35s cubic-bezier(.16,1,.3,1);
    box-shadow:0 12px 30px -12px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- 入场动画（只有 JS 正常时才隐藏，脚本失效也不会白屏） ---------- */
  .js .reveal{opacity:0;transform:translateY(18px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
  .js .reveal.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){
    .js .reveal{opacity:1;transform:none;transition:none}
    .card:hover,.social:hover,.btn:hover{transform:none}
  }
  @media print{.js .reveal{opacity:1;transform:none}}
  .empty{padding:80px 0;text-align:center;color:var(--text-2);font-size:14px;line-height:1.8}
  .empty b{color:var(--text)}
  .noscript{padding:60px 24px;text-align:center;color:var(--text-2)}
</style>
</head>
<body>
<script>document.documentElement.classList.add("js");</script>

<main>
  <section class="hero">
    <div class="avatar" id="avatar"><img src="images/avatar.jpg" alt="头像"></div>
    <h1 id="nameText">一个白西瓜</h1>
    <div class="socials">

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.813 4.653h.854c1.51.054 2.769.578 3.773 1.574 1.004.995 1.524 2.249 1.56 3.76v7.36c-.036 1.51-.556 2.769-1.56 3.773s-2.262 1.524-3.773 1.56H5.333c-1.51-.036-2.769-.556-3.773-1.56S.036 18.858 0 17.347v-7.36c.036-1.511.556-2.765 1.56-3.76 1.004-.996 2.262-1.52 3.773-1.574h.774l-1.174-1.12a1.234 1.234 0 0 1-.373-.906c0-.356.124-.658.373-.907l.027-.027c.267-.249.573-.373.92-.373.347 0 .653.124.92.373L9.653 4.44c.071.071.134.142.187.213h4.267a.836.836 0 0 1 .16-.213l2.853-2.747c.267-.249.573-.373.92-.373.347 0 .662.151.929.4.267.249.391.551.391.907 0 .355-.124.657-.373.906zM5.333 7.24c-.746.018-1.373.276-1.88.773-.506.498-.769 1.13-.786 1.894v7.52c.017.764.28 1.395.786 1.893.507.498 1.134.756 1.88.773h13.334c.746-.017 1.373-.275 1.88-.773.506-.498.769-1.129.786-1.893v-7.52c-.017-.765-.28-1.396-.786-1.894-.507-.497-1.134-.755-1.88-.773zM8 11.107c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c0-.373.129-.689.386-.947.258-.257.574-.386.947-.386zm8 0c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c.017-.391.15-.711.4-.96.249-.249.56-.373.933-.373Z"/></svg>

      <a class="social" id="linkGithub" href="#" target="_blank" rel="noopener" style="display:none">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>

  <section class="works">

<!-- 所有内容都在 data.js 里，这个文件不用改 -->
<script src="data.js"></script>
<script>
(async function () {
  const SITE = window.SITE || {};
  let APPS = [];
  try {
    const _r = await fetch("works.json?v=" + Date.now(), { cache: "no-store" });
    if (_r.ok) { const _d = await _r.json(); APPS = Array.isArray(_d) ? _d : (_d.apps || []); }
  } catch (_e) { APPS = window.APPS || []; }
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // 基础信息
  const name = SITE.name || "一个白西瓜";
  document.title = name;
  $("#nameText").textContent = name;
  $("#footCopy").textContent = "© " + (SITE.year || new Date().getFullYear()) + " " + name;
  const _av = $("#avatar"); if (_av && !_av.querySelector("img")) _av.textContent = SITE.avatar || name.slice(0, 1);

  // 账号链接：没有填的会自动隐藏
  const links = [["#linkDouyin", SITE.douyin], ["#linkBilibili", SITE.bilibili], ["#linkGithub", SITE.github]];
  links.forEach(([sel, url]) => {
    const el = $(sel);
    if (url && url.trim()) { el.href = url.trim(); el.style.display = ""; }
    else el.style.display = "none";
  });

  // 平台筛选：只有一个平台时不显示
  const platforms = [];
  APPS.forEach((a) => (a.platforms || []).forEach((p) => { if (!platforms.includes(p)) platforms.push(p); }));

  const filters = $("#filters");
  let active = "全部";
  function renderFilters() {
    if (platforms.length < 2 || !APPS.length) { filters.style.display = "none"; return; }
    filters.style.display = "";
    const list = ["全部"].concat(platforms);
    filters.innerHTML = list
      .map((p) => '<button class="chip" data-p="' + esc(p) + '" aria-pressed="' + (p === active) + '">' + esc(p) + "</button>")
      .join("");
  }
  filters.addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    active = btn.dataset.p;
    renderFilters();
    renderGrid();
  });

  // 图标
  function iconHTML(app) {
    const raw = app.icon || (app.name || "?").slice(0, 1);
    if (/^(https?:|\.\/|\/|images\/)/.test(raw)) return '<div class="app-icon"><img src="' + esc(raw) + '" alt=""></div>';
    if (/[^\x00-\x7F]/.test(raw)) return '<div class="app-icon emoji">' + esc(raw) + "</div>";
    return '<div class="app-icon tone-' + esc(app.tone || "blue") + '">' + esc(raw.slice(0, 1).toUpperCase()) + "</div>";
  }

  function btn(href, cls, label) {
    return '<a class="btn ' + cls + '" href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(label) + "</a>";
  }

  function cardHTML(app) {
    const hasDl = !!(app.download && app.download.trim());
    const hasQuark = !!(app.quark && app.quark.trim());
    const hasBaidu = !!(app.baidu && app.baidu.trim());
    const codes = [];
    if (hasDl && app.downloadCode) codes.push({ label: "提取码", code: app.downloadCode });
    if (hasQuark && app.quarkCode) codes.push({ label: "夸克提取码", code: app.quarkCode });
    if (hasBaidu && app.baiduCode) codes.push({ label: "百度提取码", code: app.baiduCode });

    let dl = "";
    if (hasDl) dl += btn(app.download, "btn-primary", "下载");
    if (hasQuark) dl += btn(app.quark, "btn-primary", "夸克网盘");
    if (hasBaidu) dl += btn(app.baidu, "btn-soft", "百度网盘");
    if (!hasDl && !hasQuark && !hasBaidu && app.github) dl += btn(app.github, "btn-soft", "GitHub 下载");

    const meta = [app.version ? "v" + app.version : "", (app.platforms || []).join(" / "), app.size || ""]
      .filter(Boolean)
      .map((m) => "<li>" + esc(m) + "</li>")
      .join("");

    const codeHTML = codes.length
      ? '<div class="codes">' + codes.map((c) =>
          '<button class="code" data-code="' + esc(c.code) + '" title="点击复制提取码">' + esc(c.label) + ' <b>' + esc(c.code) + "</b></button>"
        ).join("") + "</div>"
      : "";

    const srcHTML = app.github
      ? '<div class="card-foot"><a class="src" href="' + esc(app.github) + '" target="_blank" rel="noopener">查看源码' +
        '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h7v7M13 3 3 13"/></svg></a></div>'
      : "";

    return (
      '<article class="card reveal">' +
        '<div class="card-top">' + iconHTML(app) +
          '<div><h3 class="app-name">' + esc(app.name) + '</h3><p class="app-tagline">' + esc(app.tagline || "") + "</p></div>" +
        "</div>" +
        '<p class="app-desc">' + esc(app.desc || "") + "</p>" +
        '<ul class="meta">' + meta + "</ul>" +
        '<div class="card-spacer"></div>' +
        '<div class="dl">' + dl + "</div>" +
        codeHTML +
        srcHTML +
      "</article>"
    );
  }

  const grid = $("#grid");
  function renderGrid() {
    const list = APPS.filter((a) => active === "全部" || (a.platforms || []).includes(active));
    grid.innerHTML = list.length
      ? list.map(cardHTML).join("")
      : '<p class="empty" style="grid-column:1/-1">这里还没有作品。<br>打开 <b>admin.html</b> 添加一个吧。</p>';
    observeReveals();
  }

  // 复制提取码
  const toast = $("#toast");
  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
  }
  document.addEventListener("click", async (e) => {
    const el = e.target.closest(".code");
    if (!el) return;
    const code = el.dataset.code || "";
    try {
      await navigator.clipboard.writeText(code);
      showToast("已复制提取码 " + code);
    } catch (err) {
      const ta = document.createElement("textarea");
      ta.value = code; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); showToast("已复制提取码 " + code); }
      catch (e2) { showToast("提取码：" + code); }
      document.body.removeChild(ta);
    }
  });

  // 入场动画
  let io = null;
  if ("IntersectionObserver" in window && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.05 });
  }
  function observeReveals() {
    document.querySelectorAll(".reveal:not(.in)").forEach((el, i) => {
      if (io) {
        el.style.transitionDelay = (i % 6) * 40 + "ms";
        io.observe(el);
      } else {
        el.classList.add("in");
      }
    });
  }

  renderFilters();
  renderGrid();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>作品管理 · 一个白西瓜</title>
<style>
  :root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--text2:#6e6e73;--line:#e8e8ed;--accent:#4f9cf9}
  @media (prefers-color-scheme:dark){:root{--bg:#000;--card:#161617;--text:#f5f5f7;--text2:#8e8e93;--line:#2a2a2c}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.5}
  .wrap{max-width:680px;margin:0 auto;padding:40px 20px 90px}
  h1{font-size:28px;letter-spacing:-.02em;margin:0 0 6px}
  .sub{color:var(--text2);margin:0 0 28px;font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:20px}
  .card h2{font-size:16px;margin:0 0 14px;font-weight:600}
  label{display:block;font-size:13px;color:var(--text2);margin:12px 0 6px}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{min-height:70px;resize:vertical}
  .row{display:flex;gap:12px}
  .row>div{flex:1}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 22px;border-radius:980px;border:0;font:inherit;font-weight:500;cursor:pointer}
  .btn-primary{background:var(--text);color:var(--bg)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn-danger{background:#ffe8e6;color:#d93a2b;height:34px;padding:0 14px;font-size:13px}
  .btn:active{transform:scale(.98)}
  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .status{font-size:13px;color:var(--text2);margin-top:12px;min-height:18px;white-space:pre-wrap}
  .status.err{color:#d93a2b}
  .status.ok{color:#2f9e44}
  .work{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .work:first-of-type{border-top:0}
  .work .name{flex:1;font-weight:600}
  .work .meta{font-size:12px;color:var(--text2);font-weight:400}
  .hint{font-size:12px;color:var(--text2);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>作品管理</h1>
  <p class="sub">在这里添加作品，保存后网站约 1 分钟自动更新。</p>

  <section class="card">
    <h2>① 连接 GitHub（只需设置一次）</h2>
    <label>GitHub 令牌</label>
    <input id="token" type="password" placeholder="ghp_... 或 github_pat_...">
    <div class="hint">令牌只存在你这个浏览器里，不会上传。生成：GitHub → Settings → Developer settings → Personal access tokens，勾选该仓库的 Contents 读写权限。</div>
    <div class="actions">
      <button class="btn btn-primary" id="saveToken">保存令牌</button>
      <button class="btn btn-ghost" id="clearToken">清除</button>
    </div>
    <div class="status" id="tokenStatus"></div>
  </section>

  <section class="card">
    <h2>② 添加作品</h2>
    <label>作品名 *</label>
    <input id="f_name" placeholder="例如：我的小工具">
    <label>一句话说明</label>
    <input id="f_tagline" placeholder="显示在名字下面那行小字">
    <label>详细介绍</label>
    <textarea id="f_desc" placeholder="一两句话介绍这个作品"></textarea>
    <div class="row">
      <div><label>版本</label><input id="f_version" placeholder="1.0.0"></div>
      <div><label>大小</label><input id="f_size" placeholder="12 MB"></div>
    </div>
    <div class="row">
      <div><label>图标（字母或 emoji）</label><input id="f_icon" placeholder="L / 🎮"></div>
      <div><label>配色</label>
        <select id="f_tone">
          <option value="blue">blue（蓝）</option>
          <option value="purple">purple（紫）</option>
          <option value="green">green（绿）</option>
          <option value="orange">orange（橙）</option>
          <option value="pink">pink（粉）</option>
          <option value="gray">gray（灰）</option>
        </select>
      </div>
    </div>
    <label>支持平台（英文逗号分隔，如 Windows, macOS）</label>
    <input id="f_platforms" placeholder="Windows, macOS">
    <label>下载链接 *（网盘分享 / Release / 任何直链）</label>
    <input id="f_link" placeholder="https://...">
    <label>下载提取码（没有就留空）</label>
    <input id="f_code" placeholder="例如：abcd">
    <label>源码链接（可选）</label>
    <input id="f_github" placeholder="https://github.com/...">
    <div class="actions">
      <button class="btn btn-primary" id="addBtn">添加到网站</button>
    </div>
    <div class="status" id="addStatus"></div>
  </section>

  <section class="card">
    <h2>③ 已有作品</h2>
    <div id="workList"><div class="hint">加载中…</div></div>
    <div class="status" id="listStatus"></div>
  </section>
</div>

<script>
const OWNER = "xxx8424";
const REPO = "xxx8424.github.io";
const FILE = "works.json";
const BRANCH = "main";
const API = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + FILE;

const $ = (s) => document.querySelector(s);
const tokenEl = $("#token");
const tokenStatus = $("#tokenStatus");

const getToken = () => localStorage.getItem("gh_token") || "";
const b64enc = (s) => btoa(unescape(encodeURIComponent(s)));
const b64dec = (s) => decodeURIComponent(escape(atob(s)));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function st(el, msg, kind){ el.textContent = msg; el.className = "status" + (kind ? " " + kind : ""); }

function authHeaders(){ const t = getToken(); return t ? { Authorization: "Bearer " + t, Accept: "application/vnd.github+json", "Content-Type": "application/json" } : { Accept: "application/vnd.github+json" }; }

async function gh(method, url, body){
  const opt = { method, headers: authHeaders() };
  if (body) opt.body = JSON.stringify(body);
  const r = await fetch(url, opt);
  if (!r.ok) { const e = await r.text(); throw new Error(r.status + " " + e.slice(0, 200)); }
  return r.status === 204 ? {} : r.json();
}

async function loadWorks(){
  const r = await fetch(API + "?ref=" + BRANCH, { headers: authHeaders() });
  if (!r.ok) throw new Error("读取 works.json 失败：" + r.status);
  const j = await r.json();
  const data = JSON.parse(b64dec(j.content.replace(/\n/g, "")));
  return Array.isArray(data) ? data : (data.apps || []);
}

async function saveWorks(apps, message){
  const j = await gh("GET", API + "?ref=" + BRANCH);
  const content = b64enc(JSON.stringify({ apps }, null, 2) + "\n");
  await gh("PUT", API, { message: message || "更新作品", content, sha: j.sha, branch: BRANCH });
}

function renderList(apps){
  const box = $("#workList");
  if (!apps || !apps.length){ box.innerHTML = '<div class="hint">还没有作品，用上面的表单添加第一个吧。</div>'; return; }
  box.innerHTML = apps.map((a, i) =>
    '<div class="work">' +
      '<div style="width:34px;text-align:center;font-size:20px">' + esc(a.icon || (a.name || "?").slice(0,1)) + '</div>' +
      '<div class="name">' + esc(a.name || "(未命名)") +
        '<div class="meta">' + esc((a.platforms || []).join(" / ")) + (a.version ? " · v" + esc(a.version) : "") + '</div>' +
      '</div>' +
      '<button class="btn btn-danger" data-del="' + i + '">删除</button>' +
    '</div>'
  ).join("");
  box.querySelectorAll("[data-del]").forEach((b) => {
    b.addEventListener("click", async () => {
      if (!confirm("确定删除「" + (apps[Number(b.dataset.del)].name || "") + "」？")) return;
      try {
        const list = await loadWorks();
        list.splice(Number(b.dataset.del), 1);
        await saveWorks(list, "删除作品");
        st($("#listStatus"), "已删除，约 1 分钟后网站更新", "ok");
        refresh();
      } catch (e) { st($("#listStatus"), "删除失败：" + e.message, "err"); }
    });
  });
}

async function refresh(){
  try { renderList(await loadWorks()); }
  catch (e) { $("#workList").innerHTML = '<div class="hint">读取失败：' + esc(e.message) + '</div>'; }
}

tokenEl.value = getToken();
if (getToken()) st(tokenStatus, "已保存令牌", "ok");
$("#saveToken").addEventListener("click", () => {
  const t = tokenEl.value.trim();
  if (!t){ st(tokenStatus, "请输入令牌", "err"); return; }
  localStorage.setItem("gh_token", t);
  st(tokenStatus, "已保存令牌", "ok");
  refresh();
});
$("#clearToken").addEventListener("click", () => {
  localStorage.removeItem("gh_token");
  tokenEl.value = "";
  st(tokenStatus, "已清除", "");
});

$("#addBtn").addEventListener("click", async () => {
  const stt = $("#addStatus");
  const name = $("#f_name").value.trim();
  const link = $("#f_link").value.trim();
  if (!name){ st(stt, "作品名不能为空", "err"); return; }
  if (!link){ st(stt, "下载链接不能为空", "err"); return; }
  const app = {
    name,
    tagline: $("#f_tagline").value.trim(),
    desc: $("#f_desc").value.trim(),
    icon: $("#f_icon").value.trim() || name.slice(0, 1),
    tone: $("#f_tone").value,
    version: $("#f_version").value.trim(),
    platforms: $("#f_platforms").value.split(",").map((s) => s.trim()).filter(Boolean),
    size: $("#f_size").value.trim(),
    download: link,
    downloadCode: $("#f_code").value.trim(),
    github: $("#f_github").value.trim(),
    quark: "", quarkCode: "", baidu: "", baiduCode: ""
  };
  st(stt, "保存中…");
  try {
    const list = await loadWorks();
    list.push(app);
    await saveWorks(list, "添加作品：" + name);
    st(stt, "已添加！网站约 1 分钟后自动更新。", "ok");
    ["f_name","f_tagline","f_desc","f_version","f_size","f_icon","f_platforms","f_link","f_code","f_github"].forEach((id) => { $("#" + id).value = ""; });
    refresh();
  } catch (e) { st(stt, "保存失败：" + e.message, "err"); }
});

refresh();
</script>
</body>
</html>
